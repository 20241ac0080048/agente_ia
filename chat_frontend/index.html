<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Real-Time - Sprint 7 (Socket.io)</title>
    <!-- Script do Cliente Socket.io (Fase 4) -->
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #121212; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e1e1e; width: 95%; max-width: 600px; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; }
        .info-bar { display: flex; justify-content: space-between; font-size: 0.85rem; color: #aaa; margin-bottom: 10px; }
        .badge-online { background: #1b5e20; color: #a5d6a7; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
        .historico { height: 380px; overflow-y: auto; background: #262626; border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 10px; max-width: 85%; line-height: 1.4; word-wrap: break-word; }
        .msg.minha { background: #007bff; align-self: flex-end; }
        .msg.outros { background: #333; align-self: flex-start; }
        .msg.bot { background: #4a148c; border: 1px solid #7b1fa2; align-self: flex-start; color: #f3e5f5; }
        .msg-meta { font-size: 0.75rem; color: #ddd; margin-bottom: 4px; font-weight: bold; display: flex; justify-content: space-between; gap: 10px; }
        .typing-indicator { min-height: 1.2rem; font-size: 0.8rem; font-style: italic; color: #bbb; margin-bottom: 8px; }
        input, button { padding: 12px; border-radius: 6px; border: none; font-size: 0.95rem; }
        input { background: #333; color: white; width: 100%; margin-bottom: 10px; }
        button { cursor: pointer; font-weight: bold; }
        .btn-green { background: #28a745; color: white; }
        .btn-gray { background: #555; color: white; }
        .row { display: flex; gap: 8px; }
        .row input { margin-bottom: 0; }
        #error-msg { color: #ff6b6b; font-size: 0.85rem; }
    </style>
</head>
<body>

    <!-- TELA 1: LOGIN / CADASTRO -->
    <div class="card" id="view-login">
        <h2>🔐 Entrar na Sala Pública</h2>
        <input type="email" id="email" placeholder="Seu e-mail">
        <input type="password" id="senha" placeholder="Sua senha">
        <div class="row">
            <button class="btn-green" style="flex:1" onclick="entrar()">Entrar</button>
            <button class="btn-gray" style="flex:1" onclick="cadastrar()">Cadastrar</button>
        </div>
        <p id="error-msg"></p>
    </div>

    <!-- TELA 2: SALA EM TEMPO REAL -->
    <div class="card" id="view-chat" style="display:none;">
        <div class="header-bar">
            <div>
                <h3 style="margin:0;">💬 Sala Pública Cloud</h3>
                <span style="font-size: 0.8rem; color:#888;">Chame a IA digitando <b>@gemini</b></span>
            </div>
            <button class="btn-gray" style="padding:6px 12px;" onclick="sair()">Sair</button>
        </div>

        <div class="info-bar">
            <span id="usuario-logado">Usuário: -</span>
            <span class="badge-online" id="status-online">🟢 1 Online</span>
        </div>

        <div class="historico" id="historico"></div>

        <div class="typing-indicator" id="indicador-digitando"></div>

        <div class="row">
            <input type="text" id="campo-mensagem" placeholder="Digite sua mensagem (use @gemini para chamar o bot)..." oninput="notificarDigitacao()" onkeydown="checarEnter(event)">
            <button class="btn-green" onclick="enviarMensagem()">Enviar</button>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let socket = null;
        let meuEmail = '';
        let timeoutDigitando = null;

        // --- AUTENTICAÇÃO REST ---
        async function entrar() {
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const err = document.getElementById('error-msg');
            err.textContent = '';

            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.erro || 'Falha no login');

                localStorage.setItem('token', data.token);
                localStorage.setItem('email', data.email);
                carregarApp();
            } catch (e) {
                err.textContent = e.message;
            }
        }

        async function cadastrar() {
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const err = document.getElementById('error-msg');
            err.textContent = '';

            try {
                const res = await fetch(`${API_BASE}/api/auth/cadastro`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.erro || 'Falha no cadastro');
                alert('Conta criada com sucesso! Agora clique em Entrar.');
            } catch (e) {
                err.textContent = e.message;
            }
        }

        function sair() {
            if (socket) socket.disconnect();
            localStorage.removeItem('token');
            localStorage.removeItem('email');
            document.getElementById('view-chat').style.display = 'none';
            document.getElementById('view-login').style.display = 'block';
        }

        // --- CONEXÃO WEBSOCKET (SOCKET.IO) ---
        function conectarSocket() {
            const token = localStorage.getItem('token');
            meuEmail = localStorage.getItem('email') || '';
            document.getElementById('usuario-logado').textContent = `Logado como: ${meuEmail}`;

            // Conecta enviando o Token JWT no handshake de autenticação (Fase 5)
            socket = io(API_BASE, {
                auth: { token: token }
            });

            // Erro de autenticação no socket
            socket.on('connect_error', (err) => {
                alert(`Erro de conexão em tempo real: ${err.message}`);
                sair();
            });

            // Contador de usuários online (Desafio Hacker)
            socket.on('usuariosOnline', (total) => {
                document.getElementById('status-online').textContent = `🟢 ${total} Online`;
            });

            // Indicador de "Fulano está digitando..." (Desafio Hacker)
            socket.on('usuarioDigitando', ({ email, digitando }) => {
                const ind = document.getElementById('indicador-digitando');
                if (digitando) {
                    ind.textContent = `${email} está digitando...`;
                } else {
                    ind.textContent = '';
                }
            });

            // Recebimento de mensagens em tempo real (Fase 4)
            socket.on('mensagemRecebida', (msg) => {
                adicionarMensagemNaTela(msg);
            });
        }

        function notificarDigitacao() {
            if (!socket) return;
            socket.emit('digitando', true);

            clearTimeout(timeoutDigitando);
            timeoutDigitando = setTimeout(() => {
                socket.emit('digitando', false);
            }, 1200);
        }

        function checarEnter(event) {
            if (event.key === 'Enter') {
                enviarMensagem();
            }
        }

        function enviarMensagem() {
            const input = document.getElementById('campo-mensagem');
            const texto = input.value.trim();
            if (!texto || !socket) return;

            // Emite o evento 'novaMensagem' via WebSocket para o servidor
            socket.emit('novaMensagem', { texto: texto });
            socket.emit('digitando', false);

            input.value = '';
        }

        function adicionarMensagemNaTela(msg) {
            const hist = document.getElementById('historico');
            const div = document.createElement('div');

            let classeTipo = 'outros';
            if (msg.tipo === 'bot') {
                classeTipo = 'bot';
            } else if (msg.autor === meuEmail) {
                classeTipo = 'minha';
            }

            div.className = `msg ${classeTipo}`;
            div.innerHTML = `
                <div class="msg-meta">
                    <span>${msg.autor}</span>
                    <span>${msg.timestamp}</span>
                </div>
                <div>${DOMPurify.sanitize(marked.parse(msg.texto))}</div>
            `;

            hist.appendChild(div);
            hist.scrollTop = hist.scrollHeight;
        }

        function carregarApp() {
            if (localStorage.getItem('token')) {
                document.getElementById('view-login').style.display = 'none';
                document.getElementById('view-chat').style.display = 'block';
                conectarSocket();
            } else {
                document.getElementById('view-chat').style.display = 'none';
                document.getElementById('view-login').style.display = 'block';
            }
        }

        carregarApp();
    </script>
</body>
</html>
