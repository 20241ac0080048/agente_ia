<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Comando - Analytics e Custos</title>
    <!-- [REQ-007] Importação do Chart.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Script do Socket.io para o Desafio Hacker -->
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 25px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 25px; }
        .btn-voltar { background: #3b82f6; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; border: none; cursor: pointer; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        .card h4 { margin: 0 0 10px 0; font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
        .card .valor { font-size: 2rem; font-weight: bold; color: #38bdf8; }
        .card .custo { font-size: 0.9rem; color: #10b981; margin-top: 5px; font-weight: 500; }
        .chart-box { background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; }
        .badge-live { display: inline-flex; align-items: center; gap: 6px; background: #064e3b; color: #34d399; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        #msg-erro { color: #f87171; text-align: center; margin-top: 20px; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div>
                <h1 style="margin: 0; font-size: 1.6rem;">📊 Centro de Comando (Cloud Analytics)</h1>
                <span class="badge-live"><span class="dot"></span> Telemetria em Tempo Real</span>
            </div>
            <a href="/" class="btn-voltar">← Voltar ao Chat</a>
        </div>

        <div id="conteudo-dashboard">
            <!-- Métricas Consolidadas via MongoDB Aggregation Pipeline -->
            <div class="cards-grid">
                <div class="card">
                    <h4>Total de Tokens Gastos</h4>
                    <div class="valor" id="card-tokens">0</div>
                    <div class="custo" id="card-custo-estimado">Custo estimado: $0.0000</div>
                </div>
                <div class="card">
                    <h4>Total de Mensagens</h4>
                    <div class="valor" id="card-mensagens">0</div>
                </div>
                <div class="card">
                    <h4>Usuários Registrados</h4>
                    <div class="valor" id="card-usuarios">0</div>
                </div>
            </div>

            <!-- [REQ-007] O elemento CANVAS com ID id="graficoTokens" -->
            <div class="chart-box">
                <h3 style="margin-top: 0; color: #cbd5e1;">Histórico de Consumo de Tokens (Gemini AI)</h3>
                <canvas id="graficoTokens" height="110"></canvas>
            </div>
        </div>

        <p id="msg-erro"></p>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let meuGrafico = null;
        let totalTokensAtual = 0;

        // Custo estimado do Gemini Flash (~$0.075 por 1M tokens)
        function calcularCusto(tokens) {
            return (tokens * 0.000000075).toFixed(4);
        }

        async function carregarDashboard() {
            const token = localStorage.getItem('token');
            const erroEl = document.getElementById('msg-erro');
            erroEl.textContent = '';

            if (!token) {
                document.getElementById('conteudo-dashboard').style.display = 'none';
                erroEl.innerHTML = '⚠️ Você precisa estar logado como <b>Admin</b> para ver esta página. <a href="/" style="color: #38bdf8;">Fazer Login</a>';
                return;
            }

            try {
                // [REQ-006] Chamada à rota protegida por autenticarToken e apenasAdmin
                const res = await fetch(`${API_BASE}/api/analytics/tokens`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 403) {
                    document.getElementById('conteudo-dashboard').style.display = 'none';
                    erroEl.innerHTML = '🚫 <b>Acesso Negado (HTTP 403):</b> Sua conta não possui o papel (role) de <b>admin</b>.';
                    return;
                }

                if (!res.ok) throw new Error('Falha ao carregar métricas.');

                const dados = await res.json();

                totalTokensAtual = dados.totalTokens;
                document.getElementById('card-tokens').textContent = dados.totalTokens.toLocaleString();
                document.getElementById('card-custo-estimado').textContent = `Custo estimado: $${calcularCusto(dados.totalTokens)}`;
                document.getElementById('card-mensagens').textContent = dados.totalMensagens.toLocaleString();
                document.getElementById('card-usuarios').textContent = dados.totalUsuarios.toLocaleString();

                renderizarGrafico(dados.historico || []);
                iniciarWebSocketAoVivo(token);
            } catch (e) {
                document.getElementById('conteudo-dashboard').style.display = 'none';
                erroEl.textContent = e.message;
            }
        }

        function renderizarGrafico(historico) {
            // [REQ-007] Instanciação do Chart.js no canvas com id="graficoTokens"
            const ctx = document.getElementById('graficoTokens').getContext('2d');
            
            const labels = historico.length > 0 ? historico.map(h => h._id) : ['Hoje'];
            const valores = historico.length > 0 ? historico.map(h => h.tokensNoDia) : [totalTokensAtual];

            meuGrafico = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Tokens Gastos',
                        data: valores,
                        backgroundColor: 'rgba(56, 189, 248, 0.6)',
                        borderColor: '#38bdf8',
                        borderWidth: 2,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#94a3b8' },
                            grid: { color: '#334155' }
                        },
                        x: {
                            ticks: { color: '#94a3b8' },
                            grid: { color: '#334155' }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#cbd5e1' } }
                    }
                }
            });
        }

        // 🚀 DESAFIO HACKER: Atualização do gráfico em tempo real via WebSockets
        function iniciarWebSocketAoVivo(token) {
            const socket = io(API_BASE, { auth: { token } });

            socket.on('novoGastoDeToken', (dados) => {
                totalTokensAtual += dados.tokens;

                // Atualiza os cards
                document.getElementById('card-tokens').textContent = totalTokensAtual.toLocaleString();
                document.getElementById('card-custo-estimado').textContent = `Custo estimado: $${calcularCusto(totalTokensAtual)}`;
                
                const msgs = parseInt(document.getElementById('card-mensagens').textContent || 0) + 1;
                document.getElementById('card-mensagens').textContent = msgs.toLocaleString();

                // Atualiza o gráfico do Chart.js instantaneamente
                if (meuGrafico) {
                    const ultPosicao = meuGrafico.data.datasets[0].data.length - 1;
                    meuGrafico.data.datasets[0].data[ultPosicao] += dados.tokens;
                    meuGrafico.update();
                }
            });
        }

        carregarDashboard();
    </script>
</body>
</html>
