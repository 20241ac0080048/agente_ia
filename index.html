<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>IA Agente Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .chat-container { background: #1e1e1e; width: 90%; max-width: 500px; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .status { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #bbb; margin-bottom: 12px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #777; }
        .status-dot.online { background: #28a745; }
        .status-dot.offline { background: #dc3545; }
        .historico { height: 400px; overflow-y: auto; background: #252525; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: flex; flex-direction: column; }
        .mensagem { margin-bottom: 15px; padding: 10px 15px; border-radius: 15px; max-width: 80%; line-height: 1.4; }
        .user { background: #007bff; align-self: flex-end; color: white; }
        .bot { background: #444; align-self: flex-start; color: #eee; }
        .controles { display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 12px; border: none; border-radius: 5px; background: #333; color: white; }
        button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-enviar { background: #28a745; color: white; }
        .btn-limpar { background: #dc3545; color: white; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>🤖 Meu Agente Inteligente</h2>
        <div class="status" aria-live="polite"><span class="status-dot" id="status-dot"></span><span id="status-text">Verificando sistema...</span></div>
        <div class="historico" id="historico"></div>
        <div class="controles">
            <input type="text" id="pergunta" placeholder="Pergunte algo...">
            <button class="btn-enviar" onclick="enviarMensagem()">Enviar</button>
            <button class="btn-limpar" onclick="limparChat()">🗑️</button>
        </div>
    </div>

    <script>
        const URL_BACKEND = `${window.location.origin}/api/chat`;
        const URL_HEALTH = `${window.location.origin}/api/health`;

        async function verificarSaude() {
            const dot = document.getElementById("status-dot");
            const texto = document.getElementById("status-text");
            try {
                const res = await fetch(URL_HEALTH);
                if (!res.ok) throw new Error("Health check falhou");
                dot.className = "status-dot online";
                texto.textContent = "Sistema operacional";
            } catch (err) {
                dot.className = "status-dot offline";
                texto.textContent = "API offline";
            }
        }

        verificarSaude();

async function enviarMensagem() {
    const input = document.getElementById("pergunta");
    const historico = document.getElementById("historico");
    const texto = input.value;
    if(!texto) return;

    // Adiciona pergunta na tela
    const perguntaDiv = document.createElement("div");
    perguntaDiv.className = "mensagem user";
    perguntaDiv.textContent = texto;
    historico.appendChild(perguntaDiv);
    input.value = "";
    
    // Cria o balão de "carregando"
    const loadingDiv = document.createElement("div");
    loadingDiv.className = "mensagem bot";
    loadingDiv.innerText = "Pensando, eu estou...";
    historico.appendChild(loadingDiv);
    historico.scrollTop = historico.scrollHeight;

    try {
        const res = await fetch(URL_BACKEND, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pergunta: texto })
        });
        
        const dados = await res.json();
        
        // Remove o "carregando"
        loadingDiv.remove();
        
        // Mostra resposta formatada
        const respostaFinal = dados.resposta || dados.erro;
        const divResposta = document.createElement("div");
        divResposta.className = "mensagem bot";
        divResposta.innerHTML = DOMPurify.sanitize(marked.parse(respostaFinal));
        historico.appendChild(divResposta);
        
        historico.scrollTop = historico.scrollHeight;
    } catch (err) {
        loadingDiv.innerText = "Conectar ao servidor, eu não consegui. Verifique se ele está ligado.";
        console.error(err);
    }
}

async function limparChat() {
    if(confirm("Apagar minhas memórias, você deseja?")) {
        try {
            const res = await fetch(URL_BACKEND + "/limpar", { method: "DELETE" });
            if (!res.ok) throw new Error("Falha ao limpar historico");
            document.getElementById("historico").innerHTML = "";
        } catch (err) {
            alert("Nao foi possivel limpar o historico.");
            console.error(err);
        }
    }
}
 </script>
</body>
</html>
